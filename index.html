<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Garden Quest</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const isFileMode = window.location.protocol === 'file:'
      const inBuiltApp = /\/dist\/index\.html$/i.test(window.location.pathname)

      if (isFileMode && !inBuiltApp) {
        window.location.replace('./dist/standalone.html')
      } else {
        import('./src/main.tsx')
      }
    </script>
  </body>
</html>
